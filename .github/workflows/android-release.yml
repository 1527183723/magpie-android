name: Android APK

on:
  push:
    tags:
      - "v*-android"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false

      - uses: android-actions/setup-android@v3

      - name: Install Android 37.2, Build Tools 37 and NDK r30
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          ./scripts/build-apk.sh --abis "${{ matrix.abi }}"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "magpie Android ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
